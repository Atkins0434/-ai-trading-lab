name: Scout Trainer Tests

on:
  push:
    branches-ignore:
      - replay-results
  pull_request:
    branches:
      - main

jobs:
  workflow-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve replay cache version
        id: cache_config
        shell: bash
        run: |
          cache_version="$(jq -er .cache_version config/flatfile_replay.json)"
          echo "version=$cache_version" >> "$GITHUB_OUTPUT"
          python -m trainer.replay_provenance >> "$GITHUB_OUTPUT"

      - name: Import replay entry points
        run: python -c "import trainer.replay_provenance; import trainer.flatfile_replay"

  test:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest -v

      - name: Generate Scout fixture reports
        env:
          PYTHONPATH: .
        run: |
          python -m trainer.run_fixture_report

      - name: Upload Scout and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: scout-report-2018-01-02
          path: |
            reports/2018-01-02/scout_report.pdf
            reports/2018-01-02/scout_report.md
            reports/2018-01-02/scout_audit.pdf
            reports/2018-01-02/scout_audit.json
