name: Massive Capability Check

concurrency:
  group: massive-api-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/massive-smoke.yml"
      - "trainer/massive_capability_report.py"
      - "trainer/massive_alpha_snapshot.py"
      - "trainer/research_scout_alpha.py"
      - "trainer/run_massive_alpha.py"
      - "trainer/providers/massive.py"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/massive-smoke.yml"
      - "trainer/massive_capability_report.py"
      - "trainer/massive_alpha_snapshot.py"
      - "trainer/research_scout_alpha.py"
      - "trainer/run_massive_alpha.py"
      - "trainer/providers/massive.py"

jobs:
  probe:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Probe recent completed trading day
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: >-
          python -m trainer.massive_capability_report
          --ticker SPY
          --date 2026-09-14
      - name: Run Research Scout Alpha pipeline probe
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: >-
          python -m trainer.run_massive_alpha
          --ticker SPY
          --date 2026-09-14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: massive-capability-report
          path: reports/massive/*.json
