name: Flat-File Replay Day

concurrency:
  group: multi-day-trainer-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      trading_date:
        description: Historical trading date to replay (YYYY-MM-DD)
        required: true
        default: "2024-03-15"
      max_tickers:
        description: Optional positive ticker cap for non-research smoke mode
        required: false
        default: ""

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve replay cache version
        id: cache_config
        shell: bash
        run: |
          cache_version="$(jq -er .cache_version config/flatfile_replay.json)"
          echo "version=$cache_version" >> "$GITHUB_OUTPUT"
      - name: Restore Massive flat-file cache
        uses: actions/cache@v4
        with:
          path: data/flatfiles/
          key: massive-flatfiles-${{ github.repository }}-${{ steps.cache_config.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            massive-flatfiles-${{ github.repository }}-${{ steps.cache_config.outputs.version }}-
      - name: Restore Massive reference cache
        uses: actions/cache@v4
        with:
          path: data/reference_cache/
          key: massive-reference-${{ github.repository }}-${{ steps.cache_config.outputs.version }}-${{ github.run_id }}
          restore-keys: |
            massive-reference-${{ github.repository }}-${{ steps.cache_config.outputs.version }}-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Validate replay date and resolve paths
        id: replay
        shell: bash
        env:
          TRADING_DATE: ${{ inputs.trading_date }}
          MAX_TICKERS: ${{ inputs.max_tickers }}
        run: |
          python - <<'PY'
          import os
          from datetime import date

          from trainer.trading_calendar import generate_trading_dates

          requested = os.environ["TRADING_DATE"]
          normalized = date.fromisoformat(requested).isoformat()
          if requested != normalized:
              raise SystemExit(
                  f"trading_date must use YYYY-MM-DD format: {requested!r}"
              )
          if generate_trading_dates(normalized, normalized) != [normalized]:
              raise SystemExit(f"Not a supported US trading session: {normalized}")

          raw_cap = os.environ.get("MAX_TICKERS", "").strip()
          if raw_cap:
              try:
                  cap = int(raw_cap)
              except ValueError as exc:
                  raise SystemExit("max_tickers must be a positive integer") from exc
              if cap < 1 or str(cap) != raw_cap:
                  raise SystemExit("max_tickers must be a positive integer")
          PY
          output_root="reports/flatfile_replay/${TRADING_DATE}-to-${TRADING_DATE}"
          echo "trading_date=${TRADING_DATE}" >> "$GITHUB_OUTPUT"
          echo "output_root=${output_root}" >> "$GITHUB_OUTPUT"
          echo "max_tickers=${MAX_TICKERS}" >> "$GITHUB_OUTPUT"
          echo "REPLAY_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Report cached flat-file coverage
        shell: bash
        env:
          TRADING_DATE: ${{ steps.replay.outputs.trading_date }}
          OUTPUT_ROOT: ${{ steps.replay.outputs.output_root }}
        run: |
          mkdir -p "$OUTPUT_ROOT"
          python -m trainer.flatfile_coverage \
            --start "$TRADING_DATE" \
            --end "$TRADING_DATE" \
            | tee "$OUTPUT_ROOT/coverage_before.json"

      - name: Inspect AAL cached minute bars
        shell: bash
        env:
          MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
          MASSIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.MASSIVE_S3_SECRET_ACCESS_KEY }}
          TRADING_DATE: ${{ steps.replay.outputs.trading_date }}
        run: |
          python - <<'PY'
          import os

          from trainer.providers.massive_flatfiles import (
              MINUTE_AGGS_DATASET,
              MassiveFlatFileStore,
          )

          store = MassiveFlatFileStore.from_environment()
          store.ensure_day(MINUTE_AGGS_DATASET, os.environ["TRADING_DATE"])
          PY
          python -m trainer.flatfile_inspect \
            --dataset us_stocks_sip/minute_aggs_v1 \
            --date "$TRADING_DATE" \
            --ticker AAL

      - name: Run one-day flat-file replay
        shell: bash
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
          MASSIVE_S3_SECRET_ACCESS_KEY: ${{ secrets.MASSIVE_S3_SECRET_ACCESS_KEY }}
          TRADING_DATE: ${{ steps.replay.outputs.trading_date }}
          OUTPUT_ROOT: ${{ steps.replay.outputs.output_root }}
          MAX_TICKERS: ${{ steps.replay.outputs.max_tickers }}
        run: |
          set -o pipefail
          replay_command=(
            python -m trainer.flatfile_replay
            --start "$TRADING_DATE"
            --end "$TRADING_DATE"
            --output-root "$OUTPUT_ROOT"
          )
          if [ -n "$MAX_TICKERS" ]; then
            replay_command+=(--max-tickers "$MAX_TICKERS")
          fi
          "${replay_command[@]}" | tee "$OUTPUT_ROOT/replay_stdout.json"

      - name: Print replay summary
        if: always()
        shell: bash
        env:
          TRADING_DATE: ${{ steps.replay.outputs.trading_date }}
          OUTPUT_ROOT: ${{ steps.replay.outputs.output_root }}
        run: |
          python - <<'PY' | tee "$RUNNER_TEMP/flat-file-replay-summary.txt"
          from collections import Counter
          import json
          import os
          from pathlib import Path
          from statistics import mean
          import time

          trading_date = os.environ.get("TRADING_DATE", "unknown")
          output_root = Path(os.environ.get("OUTPUT_ROOT", "missing-output-root"))
          day_root = output_root / "days" / trading_date
          universe_path = day_root / "daily_universe_manifest.json"
          replay_path = output_root / "flatfile_replay_manifest.json"
          outcome_path = day_root / "end_of_day_outcome.json"
          benchmark_path = day_root / "benchmark_result.json"
          started_at = int(os.environ.get("REPLAY_STARTED_AT", str(int(time.time()))))

          print("Flat-File Replay Day summary")
          print(f"Trading date: {trading_date}")

          if universe_path.is_file():
              universe = json.loads(universe_path.read_text(encoding="utf-8"))
              print(f"Eligible count: {universe['eligible_symbol_count']}")
              definitive_reasons = Counter(
                  security["deciding_definitive_reason"]
                  for security in universe["securities"]
                  if not security["inclusion"]
                  and security.get("deciding_definitive_reason")
              )
              coverage_gaps = Counter(
                  reason
                  for security in universe["securities"]
                  if not security["inclusion"]
                  and not security.get("deciding_definitive_reason")
                  for reason in security["reason_codes"]
              )
              coverage_gap_count = sum(
                  1
                  for security in universe["securities"]
                  if not security["inclusion"]
                  and not security.get("deciding_definitive_reason")
              )
              print(
                  "Definitive-exclusion count: "
                  f"{sum(definitive_reasons.values())}"
              )
              print("Definitive exclusions by reason:")
              for reason, count in sorted(definitive_reasons.items()):
                  print(f"  {reason}: {count}")
              print(f"Coverage-gap count: {coverage_gap_count}")
              print("Coverage gaps by reason:")
              for reason, count in sorted(coverage_gaps.items()):
                  print(f"  {reason}: {count}")
              provider_limitations = universe["provider_limitation_metrics"]
              print("Provider limitations:")
              print(
                  "  provider_identifier_gap_count: "
                  f"{provider_limitations['provider_identifier_gap_count']}"
              )
          else:
              print(f"Universe manifest unavailable: {universe_path}")

          if replay_path.is_file():
              replay = json.loads(replay_path.read_text(encoding="utf-8"))
              print(f"Run status: {replay['status']}")
              print(
                  "Current state: "
                  f"date={replay.get('current_trading_date') or 'none'}, "
                  f"phase={replay.get('current_phase') or 'none'}"
              )
              failed_day = next(
                  (
                      day for day in reversed(replay.get("days", []))
                      if day.get("status") == "FAILED"
                  ),
                  None,
              )
              print(
                  "Last phase: "
                  f"{(failed_day or {}).get('current_phase') or replay.get('current_phase') or 'none'}"
              )
              print(f"Error: {(failed_day or {}).get('error') or 'none'}")
              print(
                  "Smoke mode: "
                  f"{replay.get('smoke_mode', False)} "
                  f"(max_tickers={replay.get('max_tickers')})"
              )
              cache = replay["reference_cache_summary"]
              print(
                  "Reference cache: "
                  f"hits={cache['hits']}, fetches={cache['fetches']}, "
                  f"definitive_misses={cache['definitive_misses']}, "
                  f"transient_retries={cache['transient_retries']}, "
                  f"unresolved_failures={cache['unresolved_failures']}, "
                  f"listed_after_lagged_date={cache['listed_after_lagged_date']}, "
                  f"errors={cache['errors']}"
              )
              bar_statistics = (
                  replay["days"][0].get("bar_statistics")
                  if replay.get("days")
                  else None
              )
              print("Real-bar statistics:")
              if bar_statistics:
                  for name, value in sorted(bar_statistics.items()):
                      print(f"  {name}: {value}")
                  duplicate_tickers = sorted({
                      item["ticker"]
                      for item in bar_statistics.get(
                          "duplicate_minute_rows", []
                      )
                  })
                  no_path_tickers = sorted(
                      ticker
                      for ticker, counts in bar_statistics.get(
                          "by_ticker", {}
                      ).items()
                      if counts.get("real_regular", 0) == 0
                  )
                  print(
                      "Tickers with duplicate minute rows: "
                      + (", ".join(duplicate_tickers) or "none")
                  )
                  print(
                      "Tickers with no regular-session path: "
                      + (", ".join(no_path_tickers) or "none")
                  )
                  excluded = replay["days"][0].get("excluded_tickers", [])
                  print(
                      "Tickers excluded for bar discontinuity: "
                      + (", ".join(sorted(item["ticker"] for item in excluded)) or "none")
                  )
              else:
                  print("  unavailable")
              scorability = (
                  replay["days"][0].get("scorability_statistics")
                  if replay.get("days")
                  else None
              )
              print("Scorability statistics:")
              if scorability:
                  print(
                      "  scorable_ticker_count: "
                      f"{scorability['scorable_ticker_count']}"
                  )
                  print(
                      "  not_scorable_ticker_count: "
                      f"{scorability['not_scorable_ticker_count']}"
                  )
                  print(
                      "  not_scorable_share: "
                      f"{scorability['not_scorable_share']:.4f}"
                  )
              else:
                  print("  unavailable")
              if outcome_path.is_file():
                  outcome = json.loads(outcome_path.read_text(encoding="utf-8"))
                  benchmark = (
                      json.loads(benchmark_path.read_text(encoding="utf-8"))
                      if benchmark_path.is_file() else {}
                  )
                  selected = [
                      item["execution_result"]
                      for item in outcome.get("outcomes", [])
                      if item.get("selected")
                  ]
                  completed = [
                      item for item in selected if item.get("trade_executed")
                  ]
                  returns = [
                      float(item["realized_return_pct"])
                      for item in completed
                  ]
                  winners = [value for value in returns if value > 0]
                  losers = [value for value in returns if value < 0]
                  captures = [
                      float(item["capture_ratio"])
                      for item in completed
                      if item.get("capture_ratio") is not None
                  ]
                  primary_exit_counts = Counter(
                      item.get("exit_reason")
                      for item in selected
                      if item.get("exit_reason") in {
                          "TRAILING_STOP", "PROFIT_TARGET", "SESSION_END"
                      }
                  )
                  primary_rejections = Counter(
                      item.get("entry_rejection_reason") or "UNSPECIFIED"
                      for item in selected
                      if item.get("exit_reason") == "ENTRY_REJECTED"
                  )
                  sample = next(iter(selected), {})
                  primary_policy_config = json.loads(
                      Path("config/execution_policy.json").read_text(
                          encoding="utf-8"
                      )
                  )
                  combined = benchmark.get(
                      "combined_summary", benchmark.get("scout_summary", {})
                  )
                  primary = {
                      "policy_id": sample.get(
                          "policy_id",
                          primary_policy_config["policy_id"],
                      ),
                      "summary": {
                          "net_realized_pnl_usd": sum(
                              float(item.get("realized_pnl_usd") or 0)
                              for item in completed
                          ),
                          "realized_return_pct": float(
                              combined.get("realized_return_pct", 0.0)
                          ),
                          "win_rate_pct": (
                              sum(value > 0 for value in returns)
                              / len(returns) * 100 if returns else None
                          ),
                          "average_winner_pct": (
                              mean(winners) if winners else None
                          ),
                          "average_loser_pct": (
                              mean(losers) if losers else None
                          ),
                          "average_capture_ratio": (
                              mean(captures) if captures else None
                          ),
                          "max_drawdown_pct": min(
                              (
                                  float(item["maximum_position_drawdown_pct"])
                                  for item in completed
                                  if item.get("maximum_position_drawdown_pct")
                                  is not None
                              ),
                              default=None,
                          ),
                          "exit_reason_counts": {
                              "TRAILING_STOP": primary_exit_counts[
                                  "TRAILING_STOP"
                              ],
                              "PROFIT_TARGET": primary_exit_counts[
                                  "PROFIT_TARGET"
                              ],
                              "SESSION_END": primary_exit_counts[
                                  "SESSION_END"
                              ],
                              "ENTRY_REJECTED": dict(primary_rejections),
                          },
                      },
                  }
                  print("Execution policy summaries:")
                  for policy in [primary, *outcome.get("policy_comparisons", [])]:
                      summary = policy["summary"]
                      value = lambda item: (
                          "n/a" if item is None else f"{float(item):.2f}"
                      )
                      exit_counts = summary["exit_reason_counts"]
                      rejections = ",".join(
                          f"{reason}:{count}"
                          for reason, count in sorted(
                              exit_counts["ENTRY_REJECTED"].items()
                          )
                      ) or "0"
                      print(
                          f"  {policy['policy_id']}: "
                          f"pnl=${summary['net_realized_pnl_usd']:.2f}, "
                          f"return={summary['realized_return_pct']:.2f}%, "
                          f"win_rate={value(summary['win_rate_pct'])}%, "
                          f"avg_win={value(summary['average_winner_pct'])}%, "
                          f"avg_loss={value(summary['average_loser_pct'])}%, "
                          f"avg_capture={value(summary['average_capture_ratio'])}, "
                          f"max_drawdown={value(summary['max_drawdown_pct'])}%, "
                          f"exits=STOP:{exit_counts['TRAILING_STOP']}|"
                          f"TARGET:{exit_counts['PROFIT_TARGET']}|"
                          f"EOD:{exit_counts['SESSION_END']}|"
                          f"REJECT:{rejections}"
                      )
              else:
                  print("Execution policy summaries: unavailable")
          else:
              print(f"Replay manifest unavailable: {replay_path}")

          elapsed = max(0, int(time.time()) - started_at)
          print(f"Total wall time: {elapsed}s ({elapsed / 60:.1f}m)")
          PY
          {
            echo "### Flat-File Replay Day"
            echo '```text'
            cat "$RUNNER_TEMP/flat-file-replay-summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate cumulative replay report
        if: always()
        shell: bash
        env:
          OUTPUT_ROOT: ${{ steps.replay.outputs.output_root }}
        run: python -m trainer.replay_report --output-root "$OUTPUT_ROOT"

      - name: Verify required replay artifacts
        if: always()
        shell: bash
        env:
          TRADING_DATE: ${{ steps.replay.outputs.trading_date }}
          OUTPUT_ROOT: ${{ steps.replay.outputs.output_root }}
          MAX_TICKERS: ${{ steps.replay.outputs.max_tickers }}
        run: |
          day_root="$OUTPUT_ROOT/days/$TRADING_DATE"
          required=(
            "$day_root/daily_universe_manifest.json"
            "$OUTPUT_ROOT/flatfile_replay_manifest.json"
            "$day_root/benchmark_result.json"
            "$day_root/replay_report.pdf"
            "$OUTPUT_ROOT/replay_summary.pdf"
          )
          if [ -z "$MAX_TICKERS" ]; then
            required+=("$day_root/postmortem.json")
          else
            echo "Smoke mode: postmortem is intentionally skipped because capped evidence is ineligible."
          fi
          missing=0
          for path in "${required[@]}"; do
            if [ -f "$path" ]; then
              echo "Artifact ready: $path"
            else
              echo "Missing required artifact: $path" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Report local cache sizes
        if: always()
        shell: bash
        run: |
          echo "GitHub Actions cache storage is limited to 10 GB per repository."
          for directory in data/flatfiles data/reference_cache; do
            if [ -d "$directory" ]; then
              human_size="$(du -sh "$directory" | cut -f1)"
              byte_size="$(du -sb "$directory" | cut -f1)"
            else
              human_size="0"
              byte_size="0"
            fi
            echo "$directory: $human_size ($byte_size bytes)"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flat-file-replay-${{ steps.replay.outputs.trading_date }}-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ steps.replay.outputs.output_root }}/
